[build]
  command = "npm ci && npm run build"
  functions = "netlify/functions"
  publish = "build/client"

[build.environment]
  NODE_ENV = "development"

[context.production]
  command = "npm ci && npm run build"
  environment = { NODE_ENV = "development" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
